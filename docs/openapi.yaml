openapi: 3.0.0
info:
  title: Your Project API
  description: API documentation for your Node.js project.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000 # Для локального тестування, не для продакшену
    description: Local development server
  - url: https://nodejs-hw-mongodb-wjqd.onrender.com
    description: Production server on Render.com
tags:
  - name: Auth
    description: User authentication and authorization operations
  - name: Contacts
    description: Contact management operations
paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get a list of contacts
      operationId: getContacts
      security:
        - bearerAuth: [] # Вимагає авторизації
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
          example: 1
        - in: query
          name: perPage
          schema:
            type: integer
            default: 10
          description: Items per page
          example: 10
      responses:
        '200':
          $ref: '#/components/responses/SuccessContactsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Contacts
      summary: Create a new contact
      operationId: createContact
      security:
        - bearerAuth: [] # Вимагає авторизації
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          $ref: '#/components/responses/SuccessContactResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get a contact by ID
      operationId: getContactById
      security:
        - bearerAuth: [] # Вимагає авторизації
      parameters:
        - in: path
          name: contactId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          required: true
          description: ID of the contact to retrieve
          example: 60d5ec49f8a3c9001c9b4d8a
      responses:
        '200':
          $ref: '#/components/responses/SuccessContactResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/ContactNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    patch:
      tags:
        - Contacts
      summary: Update a contact by ID
      operationId: updateContact
      security:
        - bearerAuth: [] # Вимагає авторизації
      parameters:
        - in: path
          name: contactId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          required: true
          description: ID of the contact to update
          example: 60d5ec49f8a3c9001c9b4d8a
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 20
                  description: Name of the contact.
                  example: Jane Doe
                phoneNumber:
                  type: string
                  minLength: 5
                  maxLength: 20
                  example: '+380671234567'
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                contactType:
                  type: string
                  enum: [personal, work, home]
                  example: work
                isFavourite:
                  type: boolean
                  example: false
                photo:
                  type: string
                  format: binary
                  description: Optional photo file for the contact.
              minProperties: 1
              description: Fields to update for the contact. At least one field must be provided.
      responses:
        '200':
          $ref: '#/components/responses/SuccessContactResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/ContactNotFoundResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - Contacts
      summary: Delete a contact by ID
      operationId: deleteContact
      security:
        - bearerAuth: [] # Вимагає авторизації
      parameters:
        - in: path
          name: contactId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          required: true
          description: ID of the contact to delete
          example: 60d5ec49f8a3c9001c9b4d8a
      responses:
        '204':
          description: No content, contact successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 204
                  message:
                    type: string
                    example: 'Contact deleted successfully'
                  data:
                    type: object
                    nullable: true
                    example: null
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/ContactNotFoundResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      # Відкритий ендпоінт, авторизація не потрібна
      security: [] # Порожня секція безпеки для відповідності правилу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          $ref: '#/components/responses/SuccessfullyRegisteredResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in a user
      operationId: loginUser
      # Відкритий ендпоінт, авторизація не потрібна
      security: [] # Порожня секція безпеки для відповідності правилу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh user token
      operationId: refreshToken
      security:
        - bearerAuth: [] # Вимагає авторизації
      responses:
        '200':
          $ref: '#/components/responses/RefreshSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Log out a user
      operationId: logoutUser
      security:
        - bearerAuth: [] # Вимагає авторизації
      responses:
        '204':
          $ref: '#/components/responses/LogoutSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/send-reset-email:
    post:
      tags:
        - Auth
      summary: Send password reset email
      operationId: sendResetEmail
      # Відкритий ендпоінт, авторизація не потрібна
      security: [] # Порожня секція безпеки для відповідності правилу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendResetEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/ResetEmailSentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
  /auth/reset-pwd:
    post:
      tags:
        - Auth
      summary: Reset user password
      operationId: resetPassword
      # Відкритий ендпоінт, авторизація не потрібна
      security: [] # Порожня секція безпеки для відповідності правилу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResetSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      type: object
      required:
        - name
        - phoneNumber
        - contactType
      properties:
        _id:
          type: string
          description: Auto-generated unique ID of the contact.
          example: 60d5ec49f8a3c9001c9b4d8a
        name:
          type: string
          minLength: 3
          maxLength: 20
          example: John Doe
        phoneNumber:
          type: string
          minLength: 5
          maxLength: 20
          example: '+380671234567'
        email:
          type: string
          format: email
          example: john.doe@example.com
        contactType:
          type: string
          enum: [personal, work, home]
          example: personal
        isFavourite:
          type: boolean
          example: true
        photo:
          type: string
          format: uri
          description: URL to the contact's photo.
          example: https://example.com/photos/john_doe.jpg
        owner:
          type: string
          description: The ID of the user who owns this contact.
          example: 60d5ec49f8a3c9001c9b4d8c
    User:
      type: object
      properties:
        _id:
          type: string
          description: Auto-generated unique ID of the user.
          example: 60d5ec49f8a3c9001c9b4d8b
        name:
          type: string
          example: Alice Smith
        email:
          type: string
          format: email
          example: alice.smith@example.com
        photo:
          type: string
          format: uri
          description: URL to the user's avatar.
          example: https://example.com/avatars/alice.jpg
        refreshToken:
          type: string
          description: Current refresh token for the user.
          nullable: true
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        createdAt:
          type: string
          format: date-time
          example: '2023-10-26T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2023-10-26T10:00:00Z'
    UserRegister:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Alice Smith
        email:
          type: string
          format: email
          example: alice.smith@example.com
        password:
          type: string
          format: password
          example: 'strongpassword123'
    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice.smith@example.com
        password:
          type: string
          format: password
          example: 'strongpassword123'
    SendResetEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - password
        - token
      properties:
        password:
          type: string
          format: password
          example: 'newStrongPassword123'
        token:
          type: string
          description: Password reset token received via email.
          example: 'somerandomtokenstring'
    Error:
      type: object
      properties:
        status:
          type: number
          example: 400
        message:
          type: string
          example: 'Bad Request'
        data:
          type: string
          nullable: true
          example: null
  responses:
    SuccessContactResponse:
      description: Contact retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Successfully found contact by id!'
              data:
                $ref: '#/components/schemas/Contact'
    SuccessContactsListResponse:
      description: A list of contacts.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Successfully found contacts'
              data:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 25
                  totalPages:
                    type: integer
                    example: 3
    UnauthorizedResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              status: 401
              message: 'Unauthorized'
              data: 'Not authorized'
    ContactNotFoundResponse:
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              status: 404
              message: 'Not found'
              data: 'Contact not found'
    BadRequestResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              status: 400
              message: 'Bad Request'
              data: 'Validation error'
    InternalServerErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              status: 500
              message: 'Internal Server Error'
              data: null
    SuccessfullyRegisteredResponse:
      description: User registered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 201
              message:
                type: string
                example: 'User created successfully!'
              data:
                $ref: '#/components/schemas/User'
    ConflictResponse:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              status: 409
              message: 'Conflict'
              data: 'Email is already in use'
    LoginSuccessResponse:
      description: User logged in successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Login successful!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  user:
                    $ref: '#/components/schemas/User'
    RefreshSuccessResponse:
      description: Token refreshed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Refresh token successful!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  user:
                    $ref: '#/components/schemas/User'
    LogoutSuccessResponse:
      description: User logged out successfully (No Content)
      content: {}
    ResetEmailSentResponse:
      description: Password reset email sent
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Password reset email sent successfully. Please check your inbox.'
              data:
                type: object
                nullable: true
                example: null
    PasswordResetSuccessResponse:
      description: Password reset successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Password successfully reset!'
              data:
                type: object
                nullable: true
                example: null
