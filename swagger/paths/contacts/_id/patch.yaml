patch:
  tags:
    - Contacts
  summary: Update a contact by ID
  operationId: updateContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        description: A valid MongoDB ObjectId
      required: true
      description: ID of the contact to update
      example: 60d5ec49f8a3c9001c9b4d8a
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              description: Name of the contact.
              example: Jane Doe
            phoneNumber:
              type: string
              minLength: 5
              maxLength: 20
              example: '+380671234567'
            email:
              type: string
              format: email
              example: jane.doe@example.com
            contactType:
              type: string
              enum: [personal, work, home]
              example: work
            isFavourite:
              type: boolean
              example: false
            photo:
              type: string
              format: binary
              description: Optional photo file for the contact.
          minProperties: 1
          description: Fields to update for the contact. At least one field must be provided.
        examples:
          updateName:
            value:
              name: Jane Doe
          updatePhone:
            value:
              phoneNumber: '+380501112233'
          updateFavorite:
            value:
              isFavourite: true
          updatePhoto:
            value:
              photo: binary file
  responses:
    '200':
      $ref: '../../../../docs/openapi.yaml#/components/responses/SuccessContactResponse'
    '401':
      $ref: '../../../../docs/openapi.yaml#/components/responses/UnauthorizedResponse'
    '404':
      $ref: '../../../../docs/openapi.yaml#/components/responses/ContactNotFoundResponse'
    '400':
      $ref: '../../../../docs/openapi.yaml#/components/responses/BadRequestResponse'
    '500':
      $ref: '../../../../docs/openapi.yaml#/components/responses/InternalServerErrorResponse'
